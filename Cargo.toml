[package]
name = "susumu"
version = "0.1.0"
default-run = "susumu"
edition = "2024"
description = "Local-first project memory: scan code into portable workflow, expectation, verification, decision, and review artifacts."
license = "MIT"
repository = "https://github.com/susumu-lang/susumu"
rust-version = "1.88"

[features]
default = []
server = [
    "dep:argon2",
    "dep:aes-gcm",
    "dep:axum",
    "dep:base64",
    "dep:jsonwebtoken",
    "dep:rand",
    "dep:reqwest",
    "dep:sqlx",
    "dep:tokio",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ignore = "0.4"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syntect = "5.2"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
argon2 = { version = "0.5", optional = true }
aes-gcm = { version = "0.10", optional = true }
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"], optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "derive", "macros"], optional = true }
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
