name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  susumu-review:
    name: Susumu self-review packet
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Build Susumu self-review
        run: >
          cargo run --locked --
          review build
          .
          --artifact-output target/susumu-self.susu
          --output target/susumu-self.review.susu
          --check-json target/susumu-check.json
          --html target/susumu-self.review.html

      - name: Summarize Susumu review
        run: |
          echo "Susumu self-review artifacts were generated." >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect susumu-check.json and susumu-self.review.html for review details." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Susumu review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: susumu-review
          path: |
            target/susumu-self.susu
            target/susumu-check.json
            target/susumu-self.review.susu
            target/susumu-self.review.html
