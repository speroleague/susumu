name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  susumu-review:
    name: Susumu self-review packet
    runs-on: ubuntu-latest
    needs: rust
    env:
      SUSUMU_ARTIFACT_DIR: target/susumu-review

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Build Susumu self-review
        run: |
          mkdir -p "$SUSUMU_ARTIFACT_DIR"
          cargo run --locked -- review build . \
            --artifact-output "$SUSUMU_ARTIFACT_DIR/project.susu" \
            --output "$SUSUMU_ARTIFACT_DIR/review.susu" \
            --check-json "$SUSUMU_ARTIFACT_DIR/check.json" \
            --html "$SUSUMU_ARTIFACT_DIR/review.html"

      - name: Verify Susumu artifacts exist
        run: |
          test -s "$SUSUMU_ARTIFACT_DIR/project.susu"
          test -s "$SUSUMU_ARTIFACT_DIR/check.json"
          test -s "$SUSUMU_ARTIFACT_DIR/review.susu"
          test -s "$SUSUMU_ARTIFACT_DIR/review.html"

      - name: Summarize Susumu review
        run: |
          {
            echo "### Susumu self-review artifacts"
            echo
            echo "The pull request generated a portable Susumu review packet and portal."
            echo
            echo "| File | Purpose |"
            echo "| --- | --- |"
            echo "| project.susu | Current deterministic project evidence model |"
            echo "| check.json | Machine-readable review/check output |"
            echo "| review.susu | Portable review packet for humans and agents |"
            echo "| review.html | Standalone stakeholder review portal |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Susumu review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: susumu-review-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/susumu-review/project.susu
            target/susumu-review/check.json
            target/susumu-review/review.susu
            target/susumu-review/review.html
